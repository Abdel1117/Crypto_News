services:
  frontend:
    build:
      target: prod 
      context: ./frontend
      args:
        - ENV=${ENV}
    expose:
      - "${PORT_FRONT}"
    depends_on:
      - backend
    

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT_BACK}"

    expose:
      - "${PORT_BACK}"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro    
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
