services:
  frontend:
    build:
      target: prod
      context: ./frontend
      args:
        - ENV=${ENV}
    expose:
      - "${PORT_FRONT}"
    restart: unless-stopped
    depends_on:
      - backend


  backend:
    build:
      context: ./backend
    env_file:
      - .env
    # Migrations first, then the API. nginx serves the API under /api and strips
    # that prefix: --root-path tells the app, so cookie paths and docs URLs match.
    # --proxy-headers lets the app see the visitor's IP sent by nginx instead of
    # nginx's own (the backend is only reachable from the compose network).
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port ${PORT_BACK}
      --root-path /api --proxy-headers --forwarded-allow-ips='*'"
    expose:
      - "${PORT_BACK}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
