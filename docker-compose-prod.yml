version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      args:
        - ENV=${ENV}
    expose:
      - "${PORT_FRONT}"
    ports: "${PORT_FRONT}:${PORT_FRONT}"
    depends_on:
      - backend
    container_name: "crypto_front"

  backend:
    build:
      context: ./backend
      args:
        - ENV=${ENV}
        - PORT_BACK=${PORT_BACK}
        - DB_HOST=${DB_HOST}
        - DB_USER=${DB_USER}
        - DB_PASSWORD=${DB_PASSWORD}
        - DB_NAME=${DB_NAME}
        - DB_PORT=${DB_PORT}
      ports:
        - "${PORT_BACK}:${PORT_BACK}"

    expose:
      - "${PORT_BACK}"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: crypto-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
