version: 2.1

jobs:
  sonar-scan:
    docker:
      - image: sonarsource/sonar-scanner-cli:latest
    working_directory: ~/project
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Run SonarCloud analysis
          command: |
            sonar-scanner \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.branch.name="$CIRCLE_BRANCH"
