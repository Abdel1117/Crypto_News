version: 2.1

# Prod pipeline: build → test → deploy, triggered on main
workflows:
  prod-pipeline:
    jobs:
      - test-frontend:
          filters:
            branches:
              only: prod
      - test-backend:
          filters:
            branches:
              only: prod
      - deploy:
          requires:
            - test-frontend
            - test-backend
          filters:
            branches:
              only: prod
