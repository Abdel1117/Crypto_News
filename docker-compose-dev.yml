version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
    container_name: crypto_front
    ports:
      - "${PORT_FRONT}:${PORT_FRONT}"
    environment:
      - NODE_ENV=${ENV}
      - ENV=${ENV}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=500
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: crypto_back
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ.get(\"PORT_BACK\", \"4000\")}/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: sh -c "uvicorn app.main:app --reload --host 0.0.0.0 --port ${PORT_BACK}"
    ports:
      - "${PORT_BACK}:${PORT_BACK}"
    environment:
      - ENV=${ENV}
      - PORT_BACK=${PORT_BACK}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
    volumes:
      - ./backend:/app
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: crypto_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
volumes:
  postgres_data:
  frontend_node_modules:
