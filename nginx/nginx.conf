events {}

http {
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:4000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80 default_server;
        server_name _;

        return 301 https://crypto-explorer.fr$request_uri;
    }

    server {
        listen 80;
        server_name crypto-explorer.fr www.crypto-explorer.fr;

        return 301 https://crypto-explorer.fr$request_uri;
    }

    server {
        listen 443 ssl;
        server_name crypto-explorer.fr www.crypto-explorer.fr;

        ssl_certificate /etc/letsencrypt/live/crypto-explorer.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crypto-explorer.fr/privkey.pem;

        if ($host = www.crypto-explorer.fr) {
            return 301 https://crypto-explorer.fr$request_uri;
        }

        location / {
            proxy_pass http://frontend;

            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        location /ws/ {
            proxy_pass http://backend/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/crypto-explorer.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crypto-explorer.fr/privkey.pem;

        return 301 https://crypto-explorer.fr$request_uri;
    }
}