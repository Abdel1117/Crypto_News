events {}

http {
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:4000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;

    # Request limits per visitor IP. Excess requests get a 429.
    # auth: login, register, Google sign-in (brute force).
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    # refresh: called on every page load and every 15 minutes. A refused refresh
    # logs the user out, so it gets its own, looser limit.
    limit_req_zone $binary_remote_addr zone=refresh:10m rate=30r/m;
    # contact: the form sends an email to the site owner (spam).
    limit_req_zone $binary_remote_addr zone=contact:10m rate=3r/m;
    # chat: each message costs a paid AI call (the backend also caps per day).
    limit_req_zone $binary_remote_addr zone=chat:10m rate=20r/m;
    # api: everything else, mostly market data from the shared CoinGecko quota.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    server {
        listen 80 default_server;
        server_name _;

        return 301 https://crypto-explorer.fr$request_uri;
    }

    server {
        listen 80;
        server_name crypto-explorer.fr www.crypto-explorer.fr;

        return 301 https://crypto-explorer.fr$request_uri;
    }

    server {
        listen 443 ssl;
        server_name crypto-explorer.fr www.crypto-explorer.fr;

        ssl_certificate /etc/letsencrypt/live/crypto-explorer.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crypto-explorer.fr/privkey.pem;

        # Security headers on every response, errors included.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        if ($host = www.crypto-explorer.fr) {
            return 301 https://crypto-explorer.fr$request_uri;
        }

        location / {
            proxy_pass http://frontend;

            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
        }

        # X-Forwarded-For is overwritten, not appended: the backend trusts it to
        # know the visitor's IP, so a value sent by the visitor must not survive.

        # Exact match: takes priority over the /api/auth/ prefix below.
        location = /api/auth/refresh {
            limit_req zone=refresh burst=20 nodelay;
            proxy_pass http://backend/auth/refresh;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend/auth/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/contact/ {
            limit_req zone=contact burst=2 nodelay;
            proxy_pass http://backend/contact/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/chat {
            limit_req zone=chat burst=5 nodelay;
            proxy_pass http://backend/chat;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Answers stream word by word: pass them through as they come.
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://backend/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/crypto-explorer.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/crypto-explorer.fr/privkey.pem;

        return 301 https://crypto-explorer.fr$request_uri;
    }
}
